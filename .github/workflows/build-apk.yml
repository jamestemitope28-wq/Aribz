name: Build ARIBZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
      flutter create --platforms=android .
      flutter create --platforms=android /tmp/aribz_template
      cp -r /tmp/aribz_template/android .
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aribz-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
